def mavenUrl="http://maven.aliyun.com/nexus/content/groups/public/"

buildscript {
	ext {
		springBootVersion = '1.5.6.RELEASE'
	}
	repositories {
        maven {
            url "${mavenUrl}"
        }
		mavenCentral()
	}
	dependencies {
		classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
	}
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'

version = '0.0.1-SNAPSHOT'
sourceCompatibility = 1.8

repositories {
	maven {
		url "${mavenUrl}"
	}
	mavenCentral()
}

bootRepackage {
	mainClass = 'iorichina.hellojava.helloface.HelloFaceApplication'
	executable = true
}

configurations {
    compile.exclude module: "spring-boot-starter-tomcat"
}

dependencies {
	compile('org.springframework.boot:spring-boot-starter')
//	runtime('org.springframework.boot:spring-boot-devtools')
//	compile('org.springframework.boot:spring-boot-devtools')
    compile("org.springframework.boot:spring-boot-starter-web")
	compile("org.springframework.boot:spring-boot-starter-jetty")
	compile("org.springframework.boot:spring-boot-starter-thymeleaf")
	//donot check html5 with property:spring.thymeleaf.mode=LEGACYHTML5
	compile('net.sourceforge.nekohtml:nekohtml:1.9.22')
    compile 'com.alibaba:fastjson:1.2.33'
    compile 'org.apache.commons:commons-lang3:3.4'
	compile 'org.apache.httpcomponents:httpclient:4.5.4'
	testCompile('org.springframework.boot:spring-boot-starter-test')
}

dependencies {
	compile files('libs/aip-core-1.3.7.jar')
	compile files('libs/face_sdk-1.3.6.jar')
	compile files('libs/json-20160810.jar')
}