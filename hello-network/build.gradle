plugins {
    id 'java'
}

group 'iorichina.hellojava'
version '0.0.1.beta'

repositories {
    maven {
        url "${mavenUrl}"
    }
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}